<html lang="en">

        .header-main { background: #1e293b; color: white; padding: 40px; margin-bottom: 20px; border-radius: 0 0 30px 30px; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .control-panel { background: #334155; color: white; padding: 25px; border-radius: 20px; margin-bottom: 30px; border: 3px solid #fbbf24; }
        .card { border-radius: 16px; margin-bottom: 30px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); background: white; overflow: hidden; }
        .plot-container { height: 450px; }
        .hall-of-fame { background: #0f172a; color: white; padding: 50px; border-radius: 30px; margin-top: 60px; border-top: 10px solid #fbbf24; }
        .scenario-badge { background: #fbbf24; color: #0f172a; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
        #zoomValue { color: #fbbf24; font-size: 1.5rem; font-weight: bold; }
        .target-box { background: #1e293b; padding: 12px; border-radius: 12px; font-size: 0.9rem; margin-top: 15px; border: 1px solid #fbbf24; }
        .no-benchmark { color: #94a3b8; font-style: italic; }
        .benchmark-found { color: #fbbf24; font-weight: bold; }
    </style>
</head>

    <div class="header-main text-center shadow-sm">
        <h1 class="fw-bold display-4">🌍 VLM-RL Global Multi-Scenario Dashboard</h1>
        <p class="lead text-info">Análisis de 15 Entornos CARLA con Rigurosidad Científica</p>

                            <div id="target-display" class="target-box"></div>

                            <div class="d-flex justify-content-between small opacity-75">

                                <span>Global</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

            <div class="col-12"><div class="card p-3"><div id="sr-plot" class="plot-container"></div></div></div>
            <div class="col-12"><div class="card p-3"><div id="cs-plot" class="plot-container"></div></div></div>
        </div>

        const scenarioTargets = {"Town01": {"as": 22.9, "rc": 1.0, "td": 5697.6, "cs": 0.03, "sr": 1.0}, "Town02": {"as": 19.3, "rc": 0.97, "td": 2028.2, "cs": 0.02, "sr": 0.93}, "Town03": {"as": 21.7, "rc": 0.91, "td": 3757.8, "cs": 1.14, "sr": 0.87}, "Town04": {"as": 22.0, "rc": 0.8, "td": 12684.1, "cs": 2.15, "sr": 0.7}, "Town05": {"as": 22.9, "rc": 0.93, "td": 3322.5, "cs": 0.46, "sr": 0.87}, "emptyTown02": {"as": 23.8, "rc": 1.0, "td": 2113.9, "cs": 0.0, "sr": 1.0}, "denseTown02": {"as": 16.1, "rc": 0.87, "td": 1819.0, "cs": 0.11, "sr": 0.8}};

        function updateDashboard() {
            const scenario = document.getElementById('scenario-select').value;
            const zoomPercent = document.getElementById('zoomSlider').value / 100;
            document.getElementById('zoomValue').innerText = document.getElementById('zoomSlider').value;
            
            const target = scenarioTargets[scenario] || null;
            const data = data_all[scenario];
            const steps = data.map(d => d.steps);

            // Actualizar UI del Target
            const targetBox = document.getElementById('target-display');
            if (target) {
                targetBox.innerHTML = `<span class="benchmark-found">✔ Benchmark Oficial (Paper):</span><br>
                                       AS: ${target.as} | RC: ${target.rc} | TD: ${target.td} | CS: ${target.cs} | SR: ${target.sr}`;
            } else {
                targetBox.innerHTML = `<span class="no-benchmark">⚠ Sin benchmark oficial en el paper para este escenario.</span>`;
            }

            const renderPlot = (id, key, title, color, targetVal, isInverse = false) => {
                const vals = data.map(d => d[key]);
                const maxVal = Math.max(...vals, targetVal || 0);
                const minVal = Math.min(...vals, targetVal || 0);
                const delta = (maxVal - minVal) || 1;

                let yRange;
                if (!isInverse) {
                    yRange = [maxVal - (delta * zoomPercent), maxVal + (delta * 0.05)];
                } else {
                    yRange = [minVal - (delta * 0.05), minVal + (delta * zoomPercent)];
                }

                const traces = [
                    { x: steps, y: vals, name: 'Resultado Local', type: 'scatter', mode: 'lines+markers', 
                       line: {color: color, width: 3}, marker: {size: 8, opacity: 0.8} }
                ];

                // SOLO AÑADIR LA LÍNEA ROJA SI EXISTE EL TARGET
                if (targetVal !== null) {
                    traces.push({ 
                        x: [steps[0], steps[steps.length-1]], 
                        y: [targetVal, targetVal], 
                        name: 'Paper Target', 
                        mode: 'lines', 
                        line: {dash: 'dash', color: '#f87171', width: 2} 
                    });
                }

                Plotly.newPlot(id, traces, {
                    title: { text: `<b>${title}</b>`, font: { size: 20 } },
                    yaxis: { range: yRange, gridcolor: '#f1f5f9' },
                    xaxis: { title: 'Steps', gridcolor: '#f1f5f9' },
                    paper_bgcolor: 'white', plot_bgcolor: 'white',
                    margin: { t: 60, b: 60, l: 80, r: 40 },
                    legend: { orientation: 'h', y: -0.15 }
                });
            };

            renderPlot('as-plot', 'as', 'Average Speed (AS)', '#3498db', target ? target.as : null);
            renderPlot('rc-plot', 'rc', 'Route Completion (RC)', '#9b59b6', target ? target.rc : null);
            renderPlot('td-plot', 'td', 'Total Distance (TD)', '#f1c40f', target ? target.td : null);
            renderPlot('sr-plot', 'sr', 'Success Rate (SR)', '#2ecc71', target ? target.sr : null);
            renderPlot('cs-plot', 'cs', 'Collision Speed (CS)', '#e67e22', target ? target.cs : null, true);

            renderRanking(data, target);
        }

        function renderRanking(data, target) {
            const maxAS = Math.max(...data.map(d => d.as)) || 1;
            const maxRC = Math.max(...data.map(d => d.rc)) || 1;
            const maxTD = Math.max(...data.map(d => d.td)) || 1;
            const maxSR = Math.max(...data.map(d => d.sr)) || 1;
            const maxCS = Math.max(...data.map(d => d.cs)) || 1;

            const ranked = data.map(d => {
                const score = ((d.as/maxAS) + (d.rc/maxRC) + (d.td/maxTD) + (d.sr/maxSR) + (1-(d.cs/(maxCS||1)))) / 5;
                return { ...d, score: score };
            }).sort((a, b) => b.score - a.score).slice(0, 10);

            const tbody = document.getElementById('rank-table-body');
            tbody.innerHTML = '';
            ranked.forEach((d, i) => {
                tbody.innerHTML += `<tr class="${i < 3 ? 'table-warning text-dark fw-bold' : ''}">
                    <td>${i+1} ${i===0?'🥇':i===1?'🥈':i===2?'🥉':''}</td>
                    <td>${d.steps.toLocaleString()}</td><td>${d.as.toFixed(2)}</td><td>${(d.rc*100).toFixed(1)}%</td>
                    <td>${d.td.toFixed(1)}</td><td>${(d.sr*100).toFixed(0)}%</td><td>${d.cs.toFixed(2)}</td>
                    <td class="text-info font-monospace">${(d.score * 100).toFixed(2)}%</td>
                </tr>`;
            });

            const categories = ['AS', 'RC', 'TD', 'SR', 'Safe'];
            const barTraces = ranked.map(r => ({
                x: categories, y: [r.as/maxAS, r.rc/maxRC, r.td/maxTD, r.sr/maxSR, 1-(r.cs/(maxCS||1))],
                name: r.steps.toLocaleString(), type: 'bar'
            }));

            Plotly.newPlot('elite-bar-plot', barTraces, {
                title: { text: '<b>Radar de Atributos: Top 10 Checkpoints</b>', font: {color: 'white'} },
                paper_bgcolor: 'rgba(0,0,0,0)', plot_bgcolor: 'rgba(0,0,0,0)', font: { color: 'white' },
                barmode: 'group', yaxis: { range: [0, 1.1], gridcolor: '#334155' },
                legend: { orientation: 'h', y: -0.2 }
            });
        }

        updateDashboard();
    </script>
</body>
